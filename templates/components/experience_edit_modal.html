<div id="edit-experience-modal" class="project-form-modal" popover="manual"
     role="dialog" aria-modal="true" aria-labelledby="edit-experience-title">
    <div class="project-form-modal__backdrop" aria-hidden="true"></div>
    <div class="project-form-modal__content">
        <h2 id="edit-experience-title">Edit Experience</h2>
        <form id="experience-edit-form" class="project-form">
            {% csrf_token %}
            {% for field in edit_form %}
            <div class="form-group">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                <span class="form-error" data-error-for="{{ field.name }}" id="error-{{ field.name }}" aria-live="polite"></span>
            </div>
            {% endfor %}
            <div class="project-form-modal__actions">
                <button type="button" class="button button-secondary" id="cancel-edit">Batal</button>
                <button type="submit" class="button">Simpan perubahan</button>
            </div>
        </form>
    </div>
</div>
